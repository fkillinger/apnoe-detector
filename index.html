<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Apnoe Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0e14; color: #a8d4f5; font-family: 'Courier New', monospace; }
    #app {
      max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem;
      display: flex; flex-direction: column; gap: 1.25rem; min-height: 100vh;
    }
    #header { display: flex; align-items: baseline; justify-content: space-between; }
    #title { font-size: 11px; letter-spacing: 0.18em; color: #2d4a6e; text-transform: uppercase; }
    #ver-badge { font-size: 10px; letter-spacing: 0.05em; color: #1e3050; margin-left: 6px; }
    #clock { font-size: 14px; color: #4a6fa5; font-variant-numeric: tabular-nums; }

    #canvas-wrap {
      position: relative; border: 0.5px solid #1a2a3a;
      border-radius: 8px; overflow: hidden; background: #060a0f;
    }
    canvas { display: block; width: 100%; height: 200px; }
    #grid-label { position: absolute; bottom: 7px; right: 10px; font-size: 10px; color: #1a2d42; letter-spacing: 0.1em; }

    #status-bar { display: flex; align-items: center; gap: 10px; min-height: 20px; }
    #breath-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #1a2a3a; flex-shrink: 0; transition: background 0.15s;
    }
    #breath-dot.active { background: #3b82f6; }
    #breath-dot.pause  { background: #ef4444; }
    #status-text { font-size: 12px; color: #2d4a6e; letter-spacing: 0.06em; }

    /* Kalibrierungs-Dialog */
    #calib-dialog {
      display: none; flex-direction: column; gap: 10px;
      background: #0d1520; border: 0.5px solid #1a2a3a;
      border-radius: 8px; padding: 1rem;
    }
    #calib-dialog-text {
      font-size: 11px; color: #4a6fa5; letter-spacing: 0.05em; line-height: 1.7;
    }
    #calib-dialog-text span { color: #2d4a6e; }
    #calib-dialog-btns { display: flex; gap: 8px; }
    .calib-btn {
      flex: 1; padding: 0.75rem 0.5rem; border-radius: 6px;
      border: 0.5px solid #1a2a3a; background: #060a0f;
      color: #4a6fa5; font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; line-height: 1.4; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .calib-btn:active { background: #152030; }
    .calib-btn.primary { border-color: #3b82f630; color: #3b82f6; }

    #calib-wrap { display: none; flex-direction: column; gap: 5px; }
    #calib-bar { height: 2px; background: #1a2a3a; border-radius: 1px; overflow: hidden; }
    #calib-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.2s; }
    #calib-text { font-size: 10px; color: #2d4a6e; letter-spacing: 0.08em; text-align: center; }

    #thr-wrap {
      display: none; flex-direction: column; gap: 6px;
      background: #0d1520; border: 0.5px solid #1a2a3a;
      border-radius: 8px; padding: 0.85rem 1rem;
    }
    #thr-header { display: flex; justify-content: space-between; align-items: baseline; }
    #thr-label { font-size: 10px; letter-spacing: 0.13em; color: #2d4a6e; text-transform: uppercase; }
    #thr-value { font-size: 12px; color: #4a6fa5; font-variant-numeric: tabular-nums; }
    #thr-slider { width: 100%; accent-color: #3b82f6; }
    #thr-hints { display: flex; justify-content: space-between; font-size: 10px; color: #1e3050; }

    #stats-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .stat-card {
      background: #0d1520; border: 0.5px solid #1a2a3a;
      border-radius: 8px; padding: 0.75rem 0.85rem;
    }
    .stat-label { font-size: 10px; letter-spacing: 0.1em; color: #2d4a6e; text-transform: uppercase; margin-bottom: 5px; }
    .stat-value { font-size: 22px; font-weight: 500; color: #4a6fa5; font-variant-numeric: tabular-nums; }
    .stat-unit { font-size: 11px; color: #2d4a6e; margin-left: 2px; }
    #stat-bpm-val { color: #3b82f6; }
    #stat-bpm-val.slow { color: #f59e0b; }
    #stat-bpm-val.fast { color: #f87171; }

    #events-wrap {
      background: #0d1520; border: 0.5px solid #1a2a3a;
      border-radius: 8px; padding: 0.85rem 1rem;
      min-height: 90px; max-height: 130px; overflow-y: auto;
    }
    #events-label { font-size: 10px; letter-spacing: 0.13em; color: #2d4a6e; text-transform: uppercase; margin-bottom: 9px; }
    .event-row {
      display: flex; justify-content: space-between;
      font-size: 12px; color: #4a6fa5; font-variant-numeric: tabular-nums; padding: 2px 0;
    }
    .event-row .dur { color: #ef4444; }
    .event-empty { font-size: 11px; color: #1e3050; font-style: italic; }

    #btn-row { display: flex; gap: 10px; }
    #btn-start {
      flex: 1; padding: 0.95rem; border-radius: 8px;
      border: 0.5px solid #1a2a3a; background: #0d1520;
      color: #4a6fa5; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 0.13em; text-transform: uppercase;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #btn-start:active { background: #152030; }
    #btn-start.running { border-color: #ef444445; color: #ef4444; }
    #btn-reset {
      padding: 0.95rem 1.1rem; border-radius: 8px;
      border: 0.5px solid #1a2a3a; background: #0d1520;
      color: #2d4a6e; font-family: 'Courier New', monospace;
      font-size: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #btn-reset:active { background: #152030; }


    /* Geräteauswahl */
    #device-dialog {
      display: none; flex-direction: column; gap: 10px;
      background: #0d1520; border: 0.5px solid #1a2a3a;
      border-radius: 8px; padding: 1rem;
    }
    #device-label {
      font-size: 10px; letter-spacing: 0.13em; color: #2d4a6e;
      text-transform: uppercase;
    }
    #device-list { display: flex; flex-direction: column; gap: 6px; }
    .device-btn {
      padding: 0.7rem 0.9rem; border-radius: 6px;
      border: 0.5px solid #1a2a3a; background: #060a0f;
      color: #4a6fa5; font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 0.05em;
      cursor: pointer; text-align: left; line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    .device-btn:active { background: #152030; }
    .device-btn.selected { border-color: #3b82f650; color: #3b82f6; }
    .device-btn .dev-type { font-size: 10px; color: #2d4a6e; display: block; margin-top: 2px; }


    #report-btn {
      padding: 0.95rem 1.1rem; border-radius: 8px;
      border: 0.5px solid #1a2a3a; background: #0d1520;
      color: #2d4a6e; font-family: 'Courier New', monospace;
      font-size: 12px; cursor: pointer; letter-spacing: 0.08em;
      -webkit-tap-highlight-color: transparent;
    }
    #report-btn:active { background: #152030; }
    #report-btn.ready { color: #34d399; border-color: #34d39940; }

    /* Nachtmodus */
    body.night { background: #000; }
    body.night #canvas-wrap { background: #020305; border-color: #0d1520; }
    body.night .stat-card { background: #050a0f; border-color: #0d1520; }
    body.night #events-wrap { background: #050a0f; border-color: #0d1520; }
    body.night #thr-wrap { background: #050a0f; border-color: #0d1520; }
    body.night #calib-dialog { background: #050a0f; border-color: #0d1520; }
    body.night #btn-start { background: #050a0f; border-color: #0d1520; }
    body.night #btn-reset { background: #050a0f; border-color: #0d1520; }
    body.night #night-btn { background: #050a0f; border-color: #0d1520; }
    body.night #title { color: #1a2a3a; }
    body.night #ver-badge { color: #0d1825; }
    body.night #clock { color: #1e3050; }
    body.night .stat-label { color: #1a2a3a; }
    body.night .stat-value { color: #2d4a6e; }
    body.night #events-label { color: #1a2a3a; }
    body.night .event-row { color: #2d4a6e; }
    body.night #status-text { color: #1a2a3a; }
    body.night #breath-dot.active { background: #1e3a6e; }
    body.night #breath-dot.pause  { background: #6e1e1e; }
    body.night #thr-label { color: #1a2a3a; }
    body.night #thr-value { color: #2d4a6e; }
    body.night #thr-hints { color: #0d1825; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <span id="title">Apnoe Monitor <span id="ver-badge">v1.13</span></span>
    <span id="clock">--:--:--</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="waveCanvas"></canvas>
    <span id="grid-label">120s</span>
  </div>

  <div id="status-bar">
    <div id="breath-dot"></div>
    <span id="status-text">bereit</span>
    <div id="wakelock-dot" title="Wake Lock"></div>
  </div>

  <div id="device-dialog">
    <div id="device-label">Mikrofon wählen</div>
    <div id="device-list"></div>
  </div>

  <div id="calib-dialog">
    <div id="calib-dialog-text"></div>
    <div id="calib-dialog-btns">
      <button class="calib-btn primary" id="btn-use-saved">Letzte verwenden</button>
      <button class="calib-btn" id="btn-new-calib">Neu kalibrieren</button>
    </div>
  </div>

  <div id="calib-wrap">
    <div id="calib-bar"><div id="calib-fill"></div></div>
    <div id="calib-text">kalibrierung…</div>
  </div>

  <div id="thr-wrap">
    <div id="thr-header">
      <span id="thr-label">Empfindlichkeit</span>
      <span id="thr-value">normal</span>
    </div>
    <input type="range" id="thr-slider" min="1" max="20" value="10" step="1">
    <div id="thr-hints"><span>empfindlicher</span><span>weniger</span></div>
  </div>

  <div id="stats-row">
    <div class="stat-card">
      <div class="stat-label">Atemzüge</div>
      <div class="stat-value"><span id="stat-bpm-val">--</span><span class="stat-unit">/min</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pausen</div>
      <div class="stat-value" id="stat-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Längste</div>
      <div class="stat-value" id="stat-longest">0<span class="stat-unit">s</span></div>
    </div>
  </div>

  <div id="events-wrap">
    <div id="events-label">Ereignisse</div>
    <div id="events-list">
      <span class="event-empty">noch keine Ereignisse</span>
    </div>
  </div>

  <div id="log-panel" style="display:none;background:#060a0f;border:0.5px solid #1a2a3a;border-radius:8px;padding:0.85rem 1rem;max-height:200px;overflow-y:auto;font-size:10px;line-height:1.8;color:#4a6fa5;font-family:'Courier New',monospace;white-space:pre-wrap;" id="log-panel"></div>
  <div id="btn-row">
    <button id="btn-start">&#9654; Start</button>
    <button id="night-btn" title="Nachtmodus">&#9790;</button>
    <button id="report-btn" title="Morning Report">REP</button>
    <button id="log-btn" title="Log anzeigen" style="padding:0.95rem 1.1rem;border-radius:8px;border:0.5px solid #1a2a3a;background:#0d1520;color:#2d4a6e;font-family:'Courier New',monospace;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;">&#9776;</button>
    <button id="btn-reset" title="Reset">&#8634;</button>
  </div>

</div>

<script>
  const WINDOW_S      = 120;
  const SAMPLE_HZ     = 10;
  const TOTAL_SAMPLES = WINDOW_S * SAMPLE_HZ;
  const CALIB_S       = 15;
  const CALIB_SAMPLES = CALIB_S * SAMPLE_HZ;
  const PAUSE_MIN_S   = 10;
  const DEBOUNCE_ON   = 3;   // Samples über Schwellwert nötig → Atem bestätigt
  const DEBOUNCE_OFF  = 3;   // Samples unter Schwellwert nötig → Pause bestätigt
  const GAIN_BOOST    = 10;
  const BPM_WINDOW_S  = 60;
  const STORAGE_KEY   = 'apnoe_calib_v1';
  const SESSION_KEY   = 'apnoe_session_v1';


  function saveSession() {
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        sessionStart,
        selectedDevName,
        events,
        longestPause,
        bpmHistory,
        lastSaved: Date.now()
      }));
    } catch(e) {}
  }

  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }

  function restoreSession() {
    const s = loadSession();
    if (!s) return;
    sessionStart    = s.sessionStart    || null;
    selectedDevName = s.selectedDevName || '';
    events          = s.events          || [];
    longestPause    = s.longestPause    || 0;
    bpmHistory      = s.bpmHistory      || [];
    // UI wiederherstellen
    document.getElementById('stat-count').textContent = events.length;
    document.getElementById('stat-longest').innerHTML =
      longestPause.toFixed(0) + '<span class="stat-unit">s</span>';
    const list = document.getElementById('events-list');
    if (events.length > 0) {
      list.innerHTML = '';
      [...events].reverse().forEach(e => {
        const row = document.createElement('div');
        row.className = 'event-row';
        row.innerHTML = '<span>' + e.t + '</span><span class="dur">' + e.dur.toFixed(0) + 's</span>';
        list.appendChild(row);
      });
    }
    if (sessionStart) {
      document.getElementById('report-btn').classList.add('ready');
    }
  }

  function sliderToMult(v) {
    return Math.pow(10, (v - 10) / 10 * Math.log10(12));
  }
  function sliderLabel(v) {
    const m = sliderToMult(v);
    if (m < 0.4)  return 'sehr hoch';
    if (m < 0.65) return 'hoch';
    if (m < 0.85) return 'erhöht';
    if (m < 1.15) return 'normal';
    if (m < 1.6)  return 'niedrig';
    if (m < 2.2)  return 'sehr niedrig';
    return 'minimal';
  }

  function saveCalib(base, dynMax) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        baseThreshold: base,
        dynamicMax: dynMax,
        sliderValue: parseInt(thrSlider.value),
        savedAt: Date.now()
      }));
    } catch(e) {}
  }

  function loadCalib() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }

  function formatSavedTime(ts) {
    const d = new Date(ts);
    return [d.getDate(), d.getMonth()+1].map(n=>String(n).padStart(2,'0')).join('.') +
      ' ' + [d.getHours(), d.getMinutes()].map(n=>String(n).padStart(2,'0')).join(':');
  }

  let running = false;
  let audioCtx = null, analyser = null, gainNode = null, stream = null;
  let sampleInterval = null, rafId = null, stateCheckInterval = null;
  let history       = new Float32Array(TOTAL_SAMPLES);
  let writeIdx      = 0;
  let baseThreshold = 0.01;
  let threshold     = 0.01;
  let calibBuf      = [];
  let calibDone     = false;
  let calibEndTime  = null;
  let dynamicMax    = 0.02;
  let pauseActive   = false, pauseStart = null;
  let pauseAlpha    = 0;
  let events = [], longestPause = 0;
  let breathTimestamps = [];
  let lastWasBreath    = false;
  let debounceOn      = 0;   // Zähler aufeinanderfolgender Samples über Schwellwert
  let debounceOff     = 0;   // Zähler aufeinanderfolgender Samples unter Schwellwert
  let pendingStream    = null;  // stream geöffnet während Dialog sichtbar
  let selectedDeviceId = null;   // gewähltes Mikrofon
  let sessionStart     = null;   // Aufnahmestart-Zeitstempel
  let selectedDevName  = '';     // Gerätename für Report
  let bpmHistory       = [];     // [{ t, bpm }] für Durchschnitt

  const canvas    = document.getElementById('waveCanvas');
  const ctx2d     = canvas.getContext('2d');
  const thrSlider = document.getElementById('thr-slider');
  const thrValue  = document.getElementById('thr-value');

  function resizeCanvas() {
    canvas.width  = canvas.parentElement.clientWidth;
    canvas.height = 200;
  }
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); drawGraph(); });

  thrSlider.addEventListener('input', () => {
    const v = parseInt(thrSlider.value);
    thrValue.textContent = sliderLabel(v);
    if (calibDone) {
      threshold = baseThreshold * sliderToMult(v);
      // Slider-Position live mitspeichern
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        stored.sliderValue = v;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
      } catch(e) {}
    }
  });

  function formatTime(d) {
    return [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2,'0')).join(':');
  }

  function updateBpm() {
    if (!calibEndTime) return;
    const now        = Date.now();
    const elapsedMin = Math.min((now - calibEndTime) / 60000, 1);
    if (elapsedMin <= 0) return;
    const cutoff     = now - BPM_WINDOW_S * 1000;
    breathTimestamps = breathTimestamps.filter(t => t > cutoff);
    const bpm        = Math.round(breathTimestamps.length / elapsedMin);
    const el         = document.getElementById('stat-bpm-val');
    el.textContent   = bpm;
    el.className     = bpm === 0 ? '' : bpm < 8 ? 'slow' : bpm > 20 ? 'fast' : '';
  }

  function drawGraph() {
    const W = canvas.width, H = canvas.height;
    ctx2d.clearRect(0, 0, W, H);

    if (pauseAlpha > 0) {
      const a = Math.round(pauseAlpha * 30).toString(16).padStart(2,'0');
      ctx2d.fillStyle = '#ef4444' + a;
      ctx2d.fillRect(0, 0, W, H);
    }

    ctx2d.strokeStyle = '#0d1825'; ctx2d.lineWidth = 0.5;
    for (let i = 1; i < 4; i++) {
      const y = Math.round(H * i / 4) + 0.5;
      ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(W, y); ctx2d.stroke();
    }
    for (let i = 1; i < 6; i++) {
      const x = Math.round(W * i / 6) + 0.5;
      ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, H); ctx2d.stroke();
    }

    if (calibDone && dynamicMax > 0) {
      const ty = H - (threshold / dynamicMax) * H * 0.88 - H * 0.04;
      if (ty > 2 && ty < H - 2) {
        ctx2d.strokeStyle = '#1a3a5e70'; ctx2d.lineWidth = 1;
        ctx2d.setLineDash([4, 4]);
        ctx2d.beginPath(); ctx2d.moveTo(0, ty); ctx2d.lineTo(W, ty); ctx2d.stroke();
        ctx2d.setLineDash([]);
      }
    }

    ctx2d.beginPath();
    ctx2d.strokeStyle = pauseAlpha > 0.3 ? '#ef6060' : '#3b82f6';
    ctx2d.lineWidth = 1.5;
    let first = true;
    for (let i = 0; i < TOTAL_SAMPLES; i++) {
      const val  = history[(writeIdx + i) % TOTAL_SAMPLES];
      const x    = (i / (TOTAL_SAMPLES - 1)) * W;
      const norm = dynamicMax > 0 ? Math.min(val / dynamicMax, 1) : 0;
      const y    = H - norm * H * 0.88 - H * 0.04;
      if (first) { ctx2d.moveTo(x, y); first = false; } else ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();
  }

  function logEvent(dur) {
    const t = formatTime(new Date());
    events.push({ t, dur });
    const list = document.getElementById('events-list');
    if (events.length === 1) list.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'event-row';
    row.innerHTML = '<span>' + t + '</span><span class="dur">' + dur.toFixed(0) + 's</span>';
    list.prepend(row);
    document.getElementById('stat-count').textContent = events.length;
    if (dur > longestPause) {
      longestPause = dur;
      document.getElementById('stat-longest').innerHTML =
        dur.toFixed(0) + '<span class="stat-unit">s</span>';
    }
    saveSession();
  }

  function applyCalib(base, dynMax) {
    baseThreshold = base;
    dynamicMax    = dynMax;
    threshold     = baseThreshold * sliderToMult(parseInt(thrSlider.value));
    calibDone     = true;
    calibEndTime  = Date.now();
    document.getElementById('thr-wrap').style.display  = 'flex';
    document.getElementById('status-text').textContent = 'überwachung aktiv';
  }

  function takeSample() {
    if (!analyser) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);

    if (!calibDone) {
      calibBuf.push(rms);
      const pct = Math.round(calibBuf.length / CALIB_SAMPLES * 100);
      document.getElementById('calib-fill').style.width = pct + '%';
      document.getElementById('calib-text').textContent = 'kalibrierung… ' + pct + '%';
      if (calibBuf.length >= CALIB_SAMPLES) {
        const sorted = [...calibBuf].sort((a, b) => a - b);
        const base   = Math.max(sorted[Math.floor(sorted.length * 0.75)] * 1.2, 0.002);
        const dynMax = Math.max(sorted[Math.floor(sorted.length * 0.98)] * 2.5, base * 4, 0.01);
        saveCalib(base, dynMax);
        document.getElementById('calib-wrap').style.display = 'none';
        applyCalib(base, dynMax);
      }
    } else {
      dynamicMax = Math.max(dynamicMax * 0.998 + rms * 0.002, threshold * 3);
      const rawBreath = rms > threshold;
      const dot  = document.getElementById('breath-dot');
      const stxt = document.getElementById('status-text');

      // Debounce: Zustandswechsel nur nach DEBOUNCE_ON/_OFF aufeinanderfolgenden Samples
      if (rawBreath) { debounceOn++; debounceOff = 0; }
      else           { debounceOff++; debounceOn = 0; }

      const confirmedBreath  = debounceOn  >= DEBOUNCE_ON;
      const confirmedSilence = debounceOff >= DEBOUNCE_OFF;

      // BPM: steigende Flanke nur bei bestätigtem Atem
      if (confirmedBreath && !lastWasBreath) breathTimestamps.push(Date.now());
      if (confirmedBreath)  lastWasBreath = true;
      if (confirmedSilence) lastWasBreath = false;
      updateBpm();

      if (confirmedBreath) {
        if (pauseActive) {
          const dur = (Date.now() - pauseStart) / 1000;
          if (dur >= PAUSE_MIN_S) logEvent(dur);
          pauseActive = false; pauseStart = null;
        }
        pauseAlpha = Math.max(0, pauseAlpha - 0.08);
        dot.className    = 'active';
        stxt.textContent = 'atem erkannt';
      } else if (confirmedSilence) {
        if (!pauseActive) { pauseActive = true; pauseStart = Date.now(); }
        const dur = (Date.now() - pauseStart) / 1000;
        if (dur >= PAUSE_MIN_S) {
          pauseAlpha = Math.min(1, pauseAlpha + 0.05);
          dot.className    = 'pause';
          stxt.textContent = 'pause: ' + dur.toFixed(0) + 's';
        } else if (dur > 3) {
          pauseAlpha = (dur - 3) / (PAUSE_MIN_S - 3) * 0.4;
          dot.className    = '';
          stxt.textContent = 'kein atem';
        } else {
          pauseAlpha = 0;
          dot.className    = '';
          stxt.textContent = 'kein atem';
        }
      }
    }

    history[writeIdx] = rms;
    writeIdx = (writeIdx + 1) % TOTAL_SAMPLES;
  }

  function renderLoop() {
    drawGraph();
    document.getElementById('clock').textContent = formatTime(new Date());
    if (running) rafId = requestAnimationFrame(renderLoop);
  }

  function startSampling() {
    running = true;
    if (!sessionStart) { sessionStart = Date.now(); saveSession(); }
    sampleInterval = setInterval(takeSample, 1000 / SAMPLE_HZ);
    rafId = requestAnimationFrame(renderLoop);
  }

  async function showDeviceSelector() {
    try {
      // Erst Permission holen damit Gerätenamen sichtbar werden
      const tmpStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      tmpStream.getTracks().forEach(t => t.stop());

      const devices    = await navigator.mediaDevices.enumerateDevices();
      const audioInputs = devices.filter(d => d.kind === 'audioinput');

      const list = document.getElementById('device-list');
      list.innerHTML = '';

      audioInputs.forEach((dev, i) => {
        const btn = document.createElement('button');
        btn.className = 'device-btn' + (dev.deviceId === selectedDeviceId ? ' selected' : '');
        const label = dev.label || 'Mikrofon ' + (i + 1);
        const isDefault = dev.deviceId === 'default';
        btn.innerHTML = label + '<span class="dev-type">' + (isDefault ? 'Standard-Gerät' : 'Externes Gerät') + '</span>';
        btn.addEventListener('click', () => {
          selectedDeviceId = dev.deviceId;
          selectedDevName  = dev.label || 'Mikrofon ' + (i + 1);
          document.getElementById('device-dialog').style.display = 'none';
          startMonitor();
        });
        list.appendChild(btn);
      });

      document.getElementById('device-dialog').style.display = 'flex';
      document.getElementById('btn-start').textContent = '■ Stop';
      document.getElementById('btn-start').classList.add('running');
    } catch(e) {
      document.getElementById('status-text').textContent = 'mikrofon fehler: ' + e.message;
    }
  }

  async function startMonitor() {
    try {
      // Stream mit gewähltem Gerät öffnen
      const audioConstraints = {
        echoCancellation: false, noiseSuppression: false,
        autoGainControl: false, channelCount: 1
      };
      if (selectedDeviceId) audioConstraints.deviceId = { exact: selectedDeviceId };

      pendingStream = await navigator.mediaDevices.getUserMedia({
        audio: audioConstraints,
        video: false
      });

      // AudioContext aufbauen
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(pendingStream);
      gainNode  = audioCtx.createGain();
      gainNode.gain.value = GAIN_BOOST;
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      src.connect(gainNode);
      gainNode.connect(analyser);
      stream = pendingStream; pendingStream = null;

      stateCheckInterval = setInterval(() => {
        if (audioCtx && audioCtx.state !== 'running') audioCtx.resume();
      }, 1000);

      document.getElementById('btn-start').textContent = '■ Stop';
      document.getElementById('btn-start').classList.add('running');
      document.getElementById('stat-bpm-val').textContent = '--';
      document.getElementById('stat-bpm-val').className   = '';

      // Gespeicherte Kalibrierung vorhanden?
      const saved = loadCalib();
      if (saved) {
        const timeStr = formatSavedTime(saved.savedAt);
        document.getElementById('calib-dialog-text').innerHTML =
          'Gespeicherte Kalibrierung vom <span>' + timeStr + '</span> verwenden?';
        document.getElementById('calib-dialog').style.display = 'flex';
      } else {
        beginNewCalib();
      }

    } catch(e) {
      document.getElementById('status-text').textContent = 'mikrofon fehler';
    }
  }

  function beginNewCalib() {
    document.getElementById('calib-dialog').style.display = 'none';
    thrSlider.value = 10; thrValue.textContent = sliderLabel(10);
    calibDone = false; calibBuf = [];
    document.getElementById('calib-wrap').style.display  = 'flex';
    document.getElementById('calib-fill').style.width    = '0%';
    document.getElementById('status-text').textContent   = 'kalibrierung…';
    startSampling();
  }

  function useSavedCalib() {
    document.getElementById('calib-dialog').style.display = 'none';
    const saved = loadCalib();
    breathTimestamps = []; lastWasBreath = false;
    debounceOn = 0; debounceOff = 0;
    pauseActive = false; pauseStart = null; pauseAlpha = 0;
    calibDone = false;
    // Slider-Position wiederherstellen
    if (saved.sliderValue !== undefined) {
      thrSlider.value = saved.sliderValue;
      thrValue.textContent = sliderLabel(saved.sliderValue);
    }
    document.getElementById('report-btn').classList.add('ready');
    applyCalib(saved.baseThreshold, saved.dynamicMax);
    startSampling();
  }

  document.getElementById('btn-use-saved').addEventListener('click', useSavedCalib);
  document.getElementById('btn-new-calib').addEventListener('click', beginNewCalib);

  function stopMonitor() {
    running = false;
    clearInterval(sampleInterval); sampleInterval = null;
    clearInterval(stateCheckInterval); stateCheckInterval = null;
    cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (pendingStream) pendingStream.getTracks().forEach(t => t.stop());
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    analyser = null; gainNode = null; stream = null; pendingStream = null;
    document.getElementById('breath-dot').className       = '';
    document.getElementById('status-text').textContent    = 'gestoppt';
    document.getElementById('btn-start').textContent      = '▶ Start';
    document.getElementById('btn-start').classList.remove('running');
    document.getElementById('calib-wrap').style.display   = 'none';
    document.getElementById('calib-dialog').style.display  = 'none';
    document.getElementById('device-dialog').style.display   = 'none';
  }

  function resetAll() {
    stopMonitor();
    history = new Float32Array(TOTAL_SAMPLES);
    writeIdx = 0; dynamicMax = 0.02; pauseAlpha = 0;
    calibDone = false; calibBuf = []; calibEndTime = null;
    pauseActive = false; pauseStart = null;
    events = []; longestPause = 0;
    breathTimestamps = []; lastWasBreath = false;
    debounceOn = 0; debounceOff = 0;
    sessionStart = null; bpmHistory = []; selectedDevName = '';
    localStorage.removeItem(SESSION_KEY);
    document.getElementById('report-btn').classList.remove('ready');
    thrSlider.value = 10; thrValue.textContent = 'normal';
    document.getElementById('thr-wrap').style.display    = 'none';
    document.getElementById('stat-count').textContent    = '0';
    document.getElementById('stat-longest').innerHTML    = '0<span class="stat-unit">s</span>';
    document.getElementById('stat-bpm-val').textContent  = '--';
    document.getElementById('stat-bpm-val').className    = '';
    document.getElementById('events-list').innerHTML     =
      '<span class="event-empty">noch keine Ereignisse</span>';
    document.getElementById('status-text').textContent   = 'bereit';
    document.getElementById('breath-dot').className      = '';
    drawGraph();
  }


  // ── Persistenter Log ───────────────────────────────────────
  const LOG_KEY = 'apnoe_log_v1';

  function persistLog(msg) {
    try {
      const logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      const ts = new Date();
      const t = [ts.getHours(), ts.getMinutes(), ts.getSeconds()]
        .map(n => String(n).padStart(2,'0')).join(':');
      logs.push(t + ' ' + msg);
      if (logs.length > 200) logs.splice(0, logs.length - 200);
      localStorage.setItem(LOG_KEY, JSON.stringify(logs));
    } catch(e) {}
  }

  // ── Wake Lock ──────────────────────────────────────────────
  let wakeLock = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) {
      persistLog('WakeLock: API nicht verfügbar');
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakelock-dot').className = 'active';
      persistLog('WakeLock: angefordert OK');
      wakeLock.addEventListener('release', () => {
        document.getElementById('wakelock-dot').className = 'lost';
        persistLog('WakeLock: VERLOREN');
        wakeLock = null;
        // Sofort neu versuchen wenn noch aktiv
        if (running) {
          setTimeout(() => {
            if (running) requestWakeLock();
          }, 1000);
        }
      });
    } catch(e) {
      document.getElementById('wakelock-dot').className = 'lost';
      persistLog('WakeLock: Fehler – ' + e.message);
    }
  }

  async function releaseWakeLock() {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    document.getElementById('wakelock-dot').className = '';
  }

  // Automatisch neu anfordern wenn Tab wieder sichtbar
  document.addEventListener('visibilitychange', async () => {
    persistLog('Visibility: ' + document.visibilityState);
    if (document.visibilityState === 'visible' && running) {
      await requestWakeLock();
    }
  });

  // AudioContext Watchdog – alle 30s prüfen und loggen
  setInterval(() => {
    if (!running) return;
    const ctxState = audioCtx ? audioCtx.state : 'null';
    const wlState  = wakeLock ? 'aktiv' : 'fehlt';
    if (ctxState !== 'running' || !wakeLock) {
      persistLog('WARNUNG ctx=' + ctxState + ' wakelock=' + wlState);
    } else {
      persistLog('OK ctx=' + ctxState + ' wakelock=' + wlState);
    }
    if (audioCtx && audioCtx.state !== 'running') {
      audioCtx.resume();
      persistLog('AudioContext: resume() aufgerufen');
    }
  }, 30000);



  // ── Morning Report ─────────────────────────────────────────
  function generateReport() {
    if (!sessionStart) {
      alert('Keine Aufnahme vorhanden.');
      return;
    }

    const now      = new Date();
    const start    = new Date(sessionStart);
    const durMs    = (calibEndTime ? now - calibEndTime : 0);
    const durMin   = Math.round(durMs / 60000);
    const durH     = Math.floor(durMin / 60);
    const durM     = durMin % 60;

    function fmt(d) {
      return [d.getDate(), d.getMonth()+1, d.getFullYear()]
        .map(n => String(n).padStart(2,'0')).join('.') + '  ' +
        [d.getHours(), d.getMinutes(), d.getSeconds()]
        .map(n => String(n).padStart(2,'0')).join(':');
    }

    const avgBpm = bpmHistory.length > 0
      ? Math.round(bpmHistory.reduce((s, e) => s + e.bpm, 0) / bpmHistory.length)
      : '--';

    const lines = [];
    lines.push('╔══════════════════════════════════════════╗');
    lines.push('║           APNOE MONITOR – BERICHT        ║');
    lines.push('╚══════════════════════════════════════════╝');
    lines.push('');
    lines.push('Datum:              ' + fmt(start));
    lines.push('Aufnahme bis:       ' + fmt(now));
    lines.push('Dauer:              ' + durH + 'h ' + durM + 'min');
    lines.push('Mikrofon:           ' + (selectedDevName || 'intern'));
    lines.push('App-Version:        v1.13');
    lines.push('');
    lines.push('──────────────────────────────────────────');
    lines.push('ATEMFREQUENZ');
    lines.push('──────────────────────────────────────────');
    lines.push('Durchschnitt:       ' + avgBpm + ' Züge/min');
    if (bpmHistory.length > 0) {
      lines.push('Verlauf:');
      bpmHistory.forEach(e => {
        const h = Math.floor(e.elapsed / 3600);
        const m = Math.floor((e.elapsed % 3600) / 60);
        const t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        lines.push('  +' + t + '  →  ' + e.bpm + ' /min');
      });
    }
    lines.push('');
    lines.push('──────────────────────────────────────────');
    lines.push('ATEMPAUSEN  (> ' + PAUSE_MIN_S + 's)');
    lines.push('──────────────────────────────────────────');
    lines.push('Anzahl:             ' + events.length);
    lines.push('Längste Pause:      ' + longestPause.toFixed(0) + 's');
    lines.push('');
    if (events.length > 0) {
      lines.push('Zeitpunkt          Dauer');
      lines.push('─────────────────────────');
      events.forEach(e => {
        lines.push('  ' + e.t + '        ' + e.dur.toFixed(0) + 's');
      });
    } else {
      lines.push('  Keine Atempausen erkannt.');
    }
    lines.push('');
    lines.push('──────────────────────────────────────────');
    lines.push('');
    lines.push('──────────────────────────────────────────');
    lines.push('SYSTEM LOG');
    lines.push('──────────────────────────────────────────');
    try {
      const logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      if (logs.length > 0) {
        logs.forEach(l => lines.push('  ' + l));
      } else {
        lines.push('  (kein Log vorhanden)');
      }
    } catch(e) { lines.push('  (Log-Fehler)'); }
    lines.push('');
    lines.push('Erstellt von Apnoe Monitor v1.13');
    lines.push('══════════════════════════════════════════');

    const text     = lines.join('\n');
    const dateStr  = [start.getFullYear(),
                      String(start.getMonth()+1).padStart(2,'0'),
                      String(start.getDate()).padStart(2,'0')]
                     .join('-');
    const filename = 'apnoe-report-' + dateStr + '.txt';

    // Download
    const blob = new Blob([text], { type: 'text/plain; charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Web Share API als Alternative (mobile)
    // if (navigator.share) {
    //   navigator.share({ title: filename, text: text });
    // }
  }

  document.getElementById('report-btn').addEventListener('click', generateReport);

  // ── Log Viewer ─────────────────────────────────────────────
  document.getElementById('log-btn').addEventListener('click', () => {
    const panel = document.getElementById('log-panel');
    const visible = panel.style.display !== 'none';
    if (visible) {
      panel.style.display = 'none';
    } else {
      try {
        const logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
        panel.textContent = logs.length
          ? logs.slice().reverse().join('\n')
          : 'noch keine Log-Einträge';
      } catch(e) { panel.textContent = 'Log-Fehler'; }
      panel.style.display = 'block';
    }
  });

  // ── Nachtmodus ─────────────────────────────────────────────
  let nightMode = false;

  document.getElementById('night-btn').addEventListener('click', () => {
    nightMode = !nightMode;
    document.body.classList.toggle('night', nightMode);
    document.getElementById('night-btn').classList.toggle('active', nightMode);
  });
  document.getElementById('btn-start').addEventListener('click', () => {
    if (running) stopMonitor(); else showDeviceSelector();
  });
  document.getElementById('btn-reset').addEventListener('click', resetAll);

  restoreSession();
  drawGraph();
  setInterval(() => {
    document.getElementById('clock').textContent = formatTime(new Date());
  }, 1000);

  // ── Service Worker (PWA) ───────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => persistLog('ServiceWorker: registriert'))
        .catch(e => persistLog('ServiceWorker: Fehler – ' + e.message));
    });
  }
</script>
